[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "medaudit"
version = "0.1.0"
description = "Evidence-first educational system for document-based auditing"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Victor Castro" }]
dependencies = [
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.26,<2",
  "xlrd>=2.0.2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-openpyxl>=3.1,<4",
  "xlwt>=1.3,<2",
]
semantic = [
  "sentence-transformers>=5,<6",
]

[project.scripts]
medaudit-inventory = "medaudit.ingestion.inventory:main"
medaudit-evaluate-bm25 = "medaudit.evaluation.baseline:main"
medaudit-profile-corpus = "medaudit.ingestion.profile:main"
medaudit-build-catalog = "medaudit.catalog.builder:main"
medaudit-audit-catalog = "medaudit.catalog.audit:main"
medaudit-process-corpus = "medaudit.ingestion.corpus:main"
medaudit-profile-chunks = "medaudit.ingestion.chunk_profile:main"
medaudit-evaluate-private-bm25 = "medaudit.evaluation.private_bm25:main"
medaudit-prepare-eval-review = "medaudit.evaluation.review_queue:main"
medaudit-finalize-eval = "medaudit.evaluation.finalize:main"
medaudit-audit-temporal-eval = "medaudit.evaluation.temporal_audit:main"
medaudit-run-temporal-baseline = "medaudit.evaluation.temporal_baseline:main"
medaudit-diagnose-baseline = "medaudit.evaluation.diagnostics:main"
medaudit-analyze-confidence = "medaudit.evaluation.confidence_analysis:main"
medaudit-split-evaluation = "medaudit.evaluation.split:main"
medaudit-materialize-eval-snapshots = "medaudit.evaluation.materialize_snapshots:main"
medaudit-calibrate-confidence-policy = "medaudit.evaluation.confidence_policy:main"
medaudit-evaluate-heldout-policy = "medaudit.evaluation.heldout_evaluation:main"
medaudit-prepare-embedding-model = "medaudit.retrieval.local_model:main"
medaudit-materialize-embedding-cache = "medaudit.retrieval.embedding_cache:main"
medaudit-benchmark-hybrid-calibration = "medaudit.evaluation.hybrid_benchmark:main"
medaudit-diagnose-hybrid-calibration = "medaudit.evaluation.hybrid_diagnostics:main"
medaudit-profile-embedding-inputs = "medaudit.evaluation.embedding_input_profile:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medaudit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
