[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "medaudit"
version = "0.1.0"
description = "Evidence-first educational system for document-based auditing"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Victor Castro" }]
dependencies = [
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.26,<2",
  "xlrd>=2.0.2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-openpyxl>=3.1,<4",
  "xlwt>=1.3,<2",
]

[project.scripts]
medaudit-inventory = "medaudit.ingestion.inventory:main"
medaudit-evaluate-bm25 = "medaudit.evaluation.baseline:main"
medaudit-profile-corpus = "medaudit.ingestion.profile:main"
medaudit-build-catalog = "medaudit.catalog.builder:main"
medaudit-audit-catalog = "medaudit.catalog.audit:main"
medaudit-process-corpus = "medaudit.ingestion.corpus:main"
medaudit-profile-chunks = "medaudit.ingestion.chunk_profile:main"
medaudit-evaluate-private-bm25 = "medaudit.evaluation.private_bm25:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medaudit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
