services:
  checks:
    build:
      context: .
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - sh
      - -c
      - >-
        pytest -p no:cacheprovider &&
        ruff check --no-cache . &&
        mypy --cache-dir=/tmp/mypy src tests

  profile:
    build:
      context: .
    network_mode: none
    read_only: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./data
        target: /private-data
        read_only: true
      - type: bind
        source: ./artifacts
        target: /artifacts
    command:
      - medaudit-profile-corpus
      - --input
      - /private-data
      - --output
      - /artifacts/corpus-profile.local.json

  profile-ocr:
    extends: profile
    command:
      - medaudit-profile-corpus
      - --input
      - /private-data
      - --output
      - /artifacts/corpus-profile-ocr.local.json
      - --enable-ocr

  catalog-bootstrap:
    extends: profile
    command:
      - medaudit-build-catalog
      - --input
      - /private-data
      - --output
      - /artifacts/catalog-bootstrap.local.json

  catalog-check:
    extends: profile
    command:
      - medaudit-audit-catalog
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data

  process:
    extends: profile
    command:
      - medaudit-process-corpus
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --output
      - /artifacts/chunks.local.jsonl
      - --reference-date
      - "${REFERENCE_DATE:-2026-09-08}"

  process-ocr:
    extends: process
    command:
      - medaudit-process-corpus
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --output
      - /artifacts/chunks.local.jsonl
      - --reference-date
      - "${REFERENCE_DATE:-2026-09-08}"
      - --enable-ocr

  chunk-profile:
    extends: profile
    command:
      - medaudit-profile-chunks
      - --input
      - /artifacts/chunks.local.jsonl
      - --output
      - /artifacts/chunk-profile.local.json

  evaluate-private-bm25:
    extends: profile
    command:
      - medaudit-evaluate-private-bm25
      - --chunks
      - /artifacts/chunks.local.jsonl
      - --cases
      - /private-data/retrieval-eval.local.json
      - --output
      - /artifacts/retrieval-eval.local.json
      - --top-k
      - "${TOP_K:-5}"
      - --min-score
      - "${MIN_SCORE:-0}"
