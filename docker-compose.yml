services:
  local-llm-download:
    build:
      context: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./models
        target: /models
    command:
      - medaudit-prepare-local-llm
      - --models
      - /models/qwen3-4b
      - --manifest
      - /models/qwen3-4b.local.json
      - --download

  local-llm-check:
    extends: local-llm-download
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
    command:
      - medaudit-prepare-local-llm
      - --models
      - /models/qwen3-4b
      - --manifest
      - /tmp/qwen3-4b.local.json

  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b10335@sha256:dd0c408a4c3285f7809323ac17f85e70ef756bf67a3a30d4eed6805a8c1df16b
    gpus: all
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - llm-internal
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
    command:
      - --model
      - /models/qwen3-4b/Qwen3-4B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "99"
      - --parallel
      - "1"
      - --flash-attn
      - "on"
      - --no-ui

  benchmark-local-llm:
    build:
      context: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      - llm-server
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - llm-internal
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
    command:
      - medaudit-benchmark-local-llm
      - --corpus
      - /app/data/synthetic_cases/corpus.json
      - --cases
      - /app/data/eval/bm25_cases.json
      - --output
      - /artifacts/local-llm-synthetic-benchmark.local.json
      - --threshold
      - "${LOCAL_LLM_SYNTHETIC_THRESHOLD:-3}"
      - --top-k
      - "${LOCAL_LLM_TOP_K:-3}"

  evaluate-local-llm-holdout:
    extends: benchmark-local-llm
    command:
      - medaudit-benchmark-local-llm
      - --corpus
      - /app/data/synthetic_cases/llm_holdout_corpus.json
      - --cases
      - /app/data/eval/llm_holdout_cases.json
      - --output
      - /artifacts/local-llm-synthetic-holdout.local.json
      - --threshold
      - "3"
      - --top-k
      - "3"
      - --expected-corpus-sha256
      - e0ca652b222069618b267d9b4013065fe393bb1f4625950743d3d2b037b8cbad
      - --expected-cases-sha256
      - 06266437cda90e7dc4757eef8115c0f29dba6e2394a9f5d725f863048798fd04
      - --refuse-overwrite

  checks:
    build:
      context: .
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - sh
      - -c
      - >-
        pytest -p no:cacheprovider &&
        ruff check --no-cache . &&
        mypy --cache-dir=/tmp/mypy src tests

  evaluate-query-understanding:
