services:
  checks:
    build:
      context: .
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - sh
      - -c
      - >-
        pytest -p no:cacheprovider &&
        ruff check --no-cache . &&
        mypy --cache-dir=/tmp/mypy src tests

  profile:
    build:
      context: .
    network_mode: none
    read_only: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./data
        target: /private-data
        read_only: true
      - type: bind
        source: ./artifacts
        target: /artifacts
    command:
      - medaudit-profile-corpus
      - --input
      - /private-data
      - --output
      - /artifacts/corpus-profile.local.json

  profile-ocr:
    extends: profile
    command:
      - medaudit-profile-corpus
      - --input
      - /private-data
      - --output
      - /artifacts/corpus-profile-ocr.local.json
      - --enable-ocr

  catalog-bootstrap:
    extends: profile
    command:
      - medaudit-build-catalog
      - --input
      - /private-data
      - --output
      - /artifacts/catalog-bootstrap.local.json

  catalog-check:
    extends: profile
    command:
      - medaudit-audit-catalog
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data

  process:
    extends: profile
    command:
      - medaudit-process-corpus
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --output
      - /artifacts/chunks.local.jsonl
      - --reference-date
      - "${REFERENCE_DATE:-2026-09-08}"

  process-ocr:
    extends: process
    command:
      - medaudit-process-corpus
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --output
      - /artifacts/chunks.local.jsonl
      - --reference-date
      - "${REFERENCE_DATE:-2026-09-08}"
      - --enable-ocr

  chunk-profile:
    extends: profile
    command:
      - medaudit-profile-chunks
      - --input
      - /artifacts/chunks.local.jsonl
      - --output
      - /artifacts/chunk-profile.local.json

  evaluate-private-bm25:
    extends: profile
    command:
      - medaudit-evaluate-private-bm25
      - --chunks
      - /artifacts/chunks.local.jsonl
      - --cases
      - /private-data/retrieval-eval.local.json
      - --output
      - /artifacts/retrieval-eval.local.json
      - --top-k
      - "${TOP_K:-5}"
      - --min-score
      - "${MIN_SCORE:-0}"

  prepare-eval-review:
    extends: profile
    command:
      - medaudit-prepare-eval-review
      - --candidates
      - /private-data/eval/rag-evaluation-candidates.local.json
      - --catalog
      - /private-data/catalog.local.json
      - --output
      - /artifacts/rag-evaluation-review.local.json

  finalize-eval:
    extends: profile
    command:
      - medaudit-finalize-eval
      - --review
      - /artifacts/rag-evaluation-review.local.json
      - --output
      - /artifacts/golden-sets
      - --default-date
      - "${REFERENCE_DATE:-2026-09-08}"

  audit-temporal-eval:
    extends: profile
    command:
      - medaudit-audit-temporal-eval
      - --golden-sets
      - /artifacts/golden-sets
      - --catalog
      - /private-data/catalog.local.json
      - --output
      - /artifacts/temporal-eval-conflicts.local.json

  temporal-baseline:
    extends: profile
    command:
      - medaudit-run-temporal-baseline
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --golden-sets
      - /artifacts/golden-sets
      - --output
      - /artifacts/temporal-baseline
      - --top-k
      - "${TOP_K:-5}"
      - --min-score
      - "${MIN_SCORE:-0}"
      - --enable-ocr

  diagnose-baseline:
    extends: profile
    command:
      - medaudit-diagnose-baseline
      - --baseline
      - /artifacts/temporal-baseline/baseline.local.json
      - --review
      - /artifacts/rag-evaluation-review.local.json
      - --output
      - /artifacts/baseline-diagnostics.local.json

  analyze-confidence:
    extends: profile
    command:
      - medaudit-analyze-confidence
      - --snapshots
      - /artifacts/temporal-baseline/snapshots
      - --golden-sets
      - /artifacts/golden-sets
      - --review
      - /artifacts/rag-evaluation-review.local.json
      - --output
      - /artifacts/confidence-analysis.local.json
      - --top-k
      - "${TOP_K:-5}"
