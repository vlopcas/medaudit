services:
  local-llm-download:
    build:
      context: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./models
        target: /models
    command:
      - medaudit-prepare-local-llm
      - --models
      - /models/qwen3-4b
      - --manifest
      - /models/qwen3-4b.local.json
      - --download

  local-llm-check:
    extends: local-llm-download
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
    command:
      - medaudit-prepare-local-llm
      - --models
      - /models/qwen3-4b
      - --manifest
      - /tmp/qwen3-4b.local.json

  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b10335@sha256:dd0c408a4c3285f7809323ac17f85e70ef756bf67a3a30d4eed6805a8c1df16b
    gpus: all
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - llm-internal
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
    command:
      - --model
      - /models/qwen3-4b/Qwen3-4B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "99"
      - --parallel
      - "1"
      - --flash-attn
      - "on"
      - --no-ui

  benchmark-local-llm:
    build:
      context: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      - llm-server
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - llm-internal
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
    command:
      - medaudit-benchmark-local-llm
      - --corpus
      - /app/data/synthetic_cases/corpus.json
      - --cases
      - /app/data/eval/bm25_cases.json
      - --output
      - /artifacts/local-llm-synthetic-benchmark.local.json
      - --threshold
      - "${LOCAL_LLM_SYNTHETIC_THRESHOLD:-3}"
      - --top-k
      - "${LOCAL_LLM_TOP_K:-3}"

  checks:
    build:
      context: .
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - sh
      - -c
      - >-
        pytest -p no:cacheprovider &&
        ruff check --no-cache . &&
        mypy --cache-dir=/tmp/mypy src tests

  embedding-model-download:
    image: medaudit-semantic:local
    build:
      context: .
      dockerfile: Dockerfile.semantic
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    gpus: all
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_XET_CACHE: /models/huggingface/xet
      XDG_CACHE_HOME: /models/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./models
        target: /models
    command:
      - medaudit-prepare-embedding-model
      - --cache
      - /models/huggingface
      - --manifest
      - /models/multilingual-e5-base.local.json
      - --download

  embedding-model-check:
    extends: embedding-model-download
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
    command:
      - medaudit-prepare-embedding-model
      - --cache
      - /models/huggingface
      - --manifest
      - /tmp/multilingual-e5-base.local.json

  materialize-embedding-cache:
    extends: embedding-model-check
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
      - type: bind
        source: ./artifacts
        target: /artifacts
    command:
      - medaudit-materialize-embedding-cache
      - --snapshots
      - /artifacts/expanded-snapshots
      - --cache
      - "/artifacts/embeddings/${EMBEDDING_CACHE_NAME:-multilingual-e5-base.local.npz}"
      - --model-cache
      - /models/huggingface
      - --batch-size
      - "${EMBEDDING_BATCH_SIZE:-32}"
      - --passage-strategy
      - "${EMBEDDING_PASSAGE_STRATEGY:-truncate-v1}"

  benchmark-hybrid-calibration:
    extends: materialize-embedding-cache
    command:
      - medaudit-benchmark-hybrid-calibration
      - --snapshots
      - /artifacts/expanded-snapshots
      - --golden-sets
      - /artifacts/golden-sets-expanded
      - --review
      - /artifacts/rag-evaluation-review-expanded.local.json
      - --split
      - /artifacts/evaluation-split.local.json
      - --embedding-cache
      - "/artifacts/embeddings/${EMBEDDING_CACHE_NAME:-multilingual-e5-base.local.npz}"
      - --model-cache
      - /models/huggingface
      - --output
      - "/artifacts/${HYBRID_BENCHMARK_OUTPUT:-hybrid-calibration-benchmark.local.json}"
      - --top-k
      - "${TOP_K:-5}"
      - --candidate-depth
      - "${HYBRID_CANDIDATE_DEPTH:-20}"
      - --rank-constant
      - "${HYBRID_RANK_CONSTANT:-60}"
      - --bm25-weight
      - "${HYBRID_BM25_WEIGHT:-1}"
      - --dense-weight
      - "${HYBRID_DENSE_WEIGHT:-1}"
      - --passage-strategy
      - "${EMBEDDING_PASSAGE_STRATEGY:-truncate-v1}"

  diagnose-hybrid-calibration:
    extends: profile
    command:
      - medaudit-diagnose-hybrid-calibration
      - --benchmark
      - "/artifacts/${HYBRID_DIAGNOSTIC_BENCHMARK:-hybrid-calibration-benchmark.local.json}"
      - --review
      - /artifacts/rag-evaluation-review-expanded.local.json
      - --output
      - /artifacts/hybrid-calibration-diagnostics.local.json

  profile-embedding-inputs:
    extends: materialize-embedding-cache
    command:
      - medaudit-profile-embedding-inputs
      - --snapshots
      - /artifacts/expanded-snapshots
      - --model-cache
      - /models/huggingface
      - --output
      - /artifacts/embedding-input-profile.local.json
      - --batch-size
      - "${TOKENIZER_BATCH_SIZE:-256}"

  profile:
    build:
      context: .
    network_mode: none
    read_only: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./data
        target: /private-data
        read_only: true
      - type: bind
        source: ./artifacts
        target: /artifacts
    command:
      - medaudit-profile-corpus
      - --input
      - /private-data
      - --output
      - /artifacts/corpus-profile.local.json

  profile-ocr:
    extends: profile
    command:
      - medaudit-profile-corpus
      - --input
      - /private-data
      - --output
      - /artifacts/corpus-profile-ocr.local.json
      - --enable-ocr

  catalog-bootstrap:
    extends: profile
    command:
      - medaudit-build-catalog
      - --input
      - /private-data
      - --output
      - /artifacts/catalog-bootstrap.local.json

  catalog-check:
    extends: profile
    command:
      - medaudit-audit-catalog
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data

  process:
    extends: profile
    command:
      - medaudit-process-corpus
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --output
      - /artifacts/chunks.local.jsonl
      - --reference-date
      - "${REFERENCE_DATE:-2026-09-08}"

  process-ocr:
    extends: process
    command:
      - medaudit-process-corpus
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --output
      - /artifacts/chunks.local.jsonl
      - --reference-date
      - "${REFERENCE_DATE:-2026-09-08}"
      - --enable-ocr

  chunk-profile:
    extends: profile
    command:
      - medaudit-profile-chunks
      - --input
      - /artifacts/chunks.local.jsonl
      - --output
      - /artifacts/chunk-profile.local.json

  evaluate-private-bm25:
    extends: profile
    command:
      - medaudit-evaluate-private-bm25
      - --chunks
      - /artifacts/chunks.local.jsonl
      - --cases
      - /private-data/retrieval-eval.local.json
      - --output
      - /artifacts/retrieval-eval.local.json
      - --top-k
      - "${TOP_K:-5}"
      - --min-score
      - "${MIN_SCORE:-0}"

  prepare-eval-review:
    extends: profile
    command:
      - medaudit-prepare-eval-review
      - --candidates
      - /private-data/eval/rag-evaluation-candidates.local.json
      - --catalog
      - /private-data/catalog.local.json
      - --output
      - /artifacts/rag-evaluation-review.local.json

  prepare-adversarial-review:
    extends: profile
    command:
      - medaudit-prepare-eval-review
      - --candidates
      - /private-data/eval/rag-evaluation-adversarial.local.json
      - --catalog
      - /private-data/catalog.local.json
      - --existing-review
      - /artifacts/rag-evaluation-review.local.json
      - --output
      - /artifacts/rag-evaluation-review-expanded.local.json

  finalize-eval:
    extends: profile
    command:
      - medaudit-finalize-eval
      - --review
      - /artifacts/rag-evaluation-review.local.json
      - --output
      - /artifacts/golden-sets
      - --default-date
      - "${REFERENCE_DATE:-2026-09-08}"

  finalize-expanded-eval:
    extends: profile
    command:
      - medaudit-finalize-eval
      - --review
      - /artifacts/rag-evaluation-review-expanded.local.json
      - --output
      - /artifacts/golden-sets-expanded
      - --default-date
      - "${REFERENCE_DATE:-2026-09-08}"

  audit-temporal-eval:
    extends: profile
    command:
      - medaudit-audit-temporal-eval
      - --golden-sets
      - /artifacts/golden-sets
      - --catalog
      - /private-data/catalog.local.json
      - --output
      - /artifacts/temporal-eval-conflicts.local.json

  temporal-baseline:
    extends: profile
    command:
      - medaudit-run-temporal-baseline
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --golden-sets
      - /artifacts/golden-sets
      - --output
      - /artifacts/temporal-baseline
      - --top-k
      - "${TOP_K:-5}"
      - --min-score
      - "${MIN_SCORE:-0}"
      - --enable-ocr

  diagnose-baseline:
    extends: profile
    command:
      - medaudit-diagnose-baseline
      - --baseline
      - /artifacts/temporal-baseline/baseline.local.json
      - --review
      - /artifacts/rag-evaluation-review.local.json
      - --output
      - /artifacts/baseline-diagnostics.local.json

  analyze-confidence:
    extends: profile
    command:
      - medaudit-analyze-confidence
      - --snapshots
      - /artifacts/temporal-baseline/snapshots
      - --golden-sets
      - /artifacts/golden-sets
      - --review
      - /artifacts/rag-evaluation-review.local.json
      - --output
      - /artifacts/confidence-analysis.local.json
      - --top-k
      - "${TOP_K:-5}"

  split-evaluation:
    extends: profile
    command:
      - medaudit-split-evaluation
      - --review
      - /artifacts/rag-evaluation-review-expanded.local.json
      - --prior-review
      - /artifacts/rag-evaluation-review.local.json
      - --output
      - /artifacts/evaluation-split.local.json
      - --calibration-fraction
      - "${CALIBRATION_FRACTION:-0.5}"
      - --seed
      - "${EVALUATION_SEED:-medaudit-evaluation-v1}"

  materialize-expanded-snapshots:
    extends: profile
    command:
      - medaudit-materialize-eval-snapshots
      - --catalog
      - /private-data/catalog.local.json
      - --input
      - /private-data
      - --golden-sets
      - /artifacts/golden-sets-expanded
      - --output
      - /artifacts/expanded-snapshots
      - --enable-ocr

  analyze-calibration-confidence:
    extends: profile
    command:
      - medaudit-analyze-confidence
      - --snapshots
      - /artifacts/expanded-snapshots
      - --golden-sets
      - /artifacts/golden-sets-expanded
      - --review
      - /artifacts/rag-evaluation-review-expanded.local.json
      - --split
      - /artifacts/evaluation-split.local.json
      - --partition
      - calibration
      - --output
      - /artifacts/confidence-calibration.local.json
      - --top-k
      - "${TOP_K:-5}"

  calibrate-confidence-policy:
    extends: profile
    command:
      - medaudit-calibrate-confidence-policy
      - --confidence
      - /artifacts/confidence-calibration.local.json
      - --output
      - /artifacts/confidence-policy.local.json
      - --min-answerable-acceptance
      - "${MIN_ANSWERABLE_ACCEPTANCE:-0.8}"

  calibrate-multisignal-policy:
    extends: profile
    command:
      - medaudit-calibrate-multisignal-policy
      - --confidence
      - /artifacts/confidence-calibration.local.json
      - --output
      - /artifacts/confidence-policy-multisignal-candidate.local.json
      - --min-answerable-acceptance
      - "${MIN_ANSWERABLE_ACCEPTANCE:-0.8}"

  cross-validate-multisignal-policy:
    extends: profile
    command:
      - medaudit-cross-validate-multisignal-policy
      - --confidence
      - /artifacts/confidence-calibration.local.json
      - --output
      - /artifacts/confidence-policy-multisignal-cv.local.json
      - --min-answerable-acceptance
      - "${MIN_ANSWERABLE_ACCEPTANCE:-0.8}"
      - --fold-count
      - "${MULTISIGNAL_FOLD_COUNT:-5}"

  evaluate-heldout-policy:
    extends: profile
    command:
      - medaudit-evaluate-heldout-policy
      - --snapshots
      - /artifacts/expanded-snapshots
      - --golden-sets
      - /artifacts/golden-sets-expanded
      - --review
      - /artifacts/rag-evaluation-review-expanded.local.json
      - --split
      - /artifacts/evaluation-split.local.json
      - --policy
      - /artifacts/confidence-policy.local.json
      - --calibration
      - /artifacts/confidence-calibration.local.json
      - --output
      - /artifacts/heldout-policy-evaluation.local.json
      - --top-k
      - "${TOP_K:-5}"

networks:
  llm-internal:
    internal: true
