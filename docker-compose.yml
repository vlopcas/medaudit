services:
  checks:
    build:
      context: .
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - sh
      - -c
      - >-
        pytest -p no:cacheprovider &&
        ruff check --no-cache . &&
        mypy --cache-dir=/tmp/mypy src tests

  profile:
    build:
      context: .
    network_mode: none
    read_only: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./data
        target: /private-data
        read_only: true
      - type: bind
        source: ./artifacts
        target: /artifacts
    command:
      - medaudit-profile-corpus
      - --input
      - /private-data
      - --output
      - /artifacts/corpus-profile.local.json

  profile-ocr:
    extends: profile
    command:
      - medaudit-profile-corpus
      - --input
      - /private-data
      - --output
      - /artifacts/corpus-profile-ocr.local.json
      - --enable-ocr

  catalog:
    extends: profile
    command:
      - medaudit-build-catalog
      - --input
      - /private-data
      - --output
      - /artifacts/catalog.local.json
